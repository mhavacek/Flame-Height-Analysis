
name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.0

      - name: Build executable
        run: pyinstaller fire_level.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlameHeightAnalysis-Windows
          path: dist/FlameHeightAnalysis/
          retention-days: 30

      - name: Package into ZIP
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/FlameHeightAnalysis -DestinationPath FlameHeightAnalysis-Windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FlameHeightAnalysis-Windows.zip
          generate_release_notes: true
